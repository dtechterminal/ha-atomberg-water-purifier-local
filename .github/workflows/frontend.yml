name: Dashboard card
on: [push, pull_request]
permissions:
  contents: read
jobs:
  card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The served file must be exactly what this source builds
      - run: git diff --exit-code -- ../custom_components/atomberg_purifier_local/www
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
